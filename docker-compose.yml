services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio-data:/data
    ports:
      - "9002:9000"
      - "9003:9001"

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow_db
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow_home/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      MINIO_BUCKET: invoices
      PGHOST: postgres
      PGUSER: airflow
      PGPASSWORD: airflow
      PGDATABASE: invoice_db
    env_file:
      - .env
    volumes:
      - ./:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin123
      --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment: *airflow-env
    env_file:
      - .env
    volumes:
      - ./:/opt/airflow/project
    command: scheduler

  airflow-webserver:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    env_file:
      - .env
    volumes:
      - ./:/opt/airflow/project
    ports:
      - "8081:8080"
    command: webserver

volumes:
  postgres-data:
  minio-data:
